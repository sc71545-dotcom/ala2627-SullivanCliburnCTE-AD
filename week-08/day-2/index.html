<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tank Battle</title>
  <link rel="stylesheet" href="styles.css">
</head>

<body>
  <main class="game-shell">
    <header class="topbar">
      <div>
        <p class="eyebrow">Training Range // Sector 07</p>
        <h1>Tank Battle</h1>
      </div>
      <div class="scoreboard" aria-label="Game status">
        <span>Hits <strong id="hits">0</strong></span>
        <span>Shots <strong id="shots">0</strong></span>
      </div>
    </header>
    <section class="game-card" aria-label="Tank game">
      <div class="arena" id="arena">
        <div class="hud"><span id="status">Enemy tank in range</span><span>Armor <strong id="armor">5</strong>/5</span>
        </div>
        <div class="tank" id="tank" aria-label="Your tank">
          <div class="turret">
            <div class="barrel"></div>
          </div>
          <div class="tank-body"><span></span><span></span></div>
          <div class="track track-left"></div>
          <div class="track track-right"></div>
        </div>
        <div class="tank enemy-tank" id="enemyTank" aria-label="Enemy tank">
          <div class="turret">
            <div class="barrel"></div>
          </div>
          <div class="tank-body"><span></span><span></span></div>
          <div class="track track-left"></div>
          <div class="track track-right"></div>
        </div>
      </div>
      <div class="controls" aria-label="Game controls">
        <div class="direction-pad" aria-label="Tank movement">
          <button class="control-button up" data-move="forward" aria-label="Move forward">W</button>
          <button class="control-button left" data-move="turn-left" aria-label="Turn left">A</button>
          <button class="control-button down" data-move="backward" aria-label="Move backward">S</button>
          <button class="control-button right" data-move="turn-right" aria-label="Turn right">D</button>
        </div>
        <button class="shoot-button" id="shoot" type="button"><span class="crosshair">+</span> SHOOT</button>
        <button class="reset-button" id="reset" type="button">Reset range</button>
      </div>
      <p class="instructions">Move with <b>W A S D</b>. Aim with the <b>mouse</b>, then fire.</p>
    </section>
  </main>
  <script src="script.js"></script>
</body>

</html>
