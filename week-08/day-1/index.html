<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tank Target Range</title>
  <link rel="stylesheet" href="styles.css">
</head>

<body>
  <main class="game-shell">
    <header class="topbar">
      <div>
        <p class="eyebrow">Training Range // Sector 07</p>
        <h1>Tank Target Range</h1>
      </div>
      <div class="scoreboard" aria-label="Game status">
        <span>Hits <strong id="hits">0</strong></span>
        <span>Shots <strong id="shots">0</strong></span>
      </div>
    </header>

    <section class="game-card" aria-label="Tank game">
      <div class="arena" id="arena">
        <div class="hud"><span id="status">Target acquired</span><span>Armor 100%</span></div>
        <div class="target" id="target" role="img" aria-label="Target">
          <span class="target-ring ring-one"></span>
          <span class="target-ring ring-two"></span>
          <span class="target-core"></span>
          <span class="target-label">TARGET</span>
        </div>
        <div class="tank" id="tank" aria-label="Your tank">
          <div class="turret">
            <div class="barrel"></div>
          </div>
          <div class="tank-body"><span></span><span></span></div>
          <div class="track track-left"></div>
          <div class="track track-right"></div>
        </div>
      </div>

      <div class="controls" aria-label="Game controls">
        <div class="direction-pad" aria-label="Tank movement">
          <button class="control-button up" data-move="up" aria-label="Move up">&#9650;</button>
          <button class="control-button left" data-move="left" aria-label="Move left">&#9664;</button>
          <button class="control-button down" data-move="down" aria-label="Move down">&#9660;</button>
          <button class="control-button right" data-move="right" aria-label="Move right">&#9654;</button>
        </div>
        <button class="shoot-button" id="shoot" type="button"><span class="crosshair">+</span> SHOOT</button>
        <button class="reset-button" id="reset" type="button">Reset range</button>
      </div>
      <p class="instructions">Move with <b>W A S D</b> or the arrows. Line up the barrel and hit the target.</p>
    </section>
  </main>
  <script src="script.js"></script>
</body>

</html>
